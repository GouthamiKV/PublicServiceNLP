<!DOCTYPE html>
<html>
<head>
    <title>Track Complaint - Public Service App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        /* Navigation */
        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ddd;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        #result {
            margin-top: 25px;
        }

        .item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .status {
            font-weight: bold;
        }

        .error {
            background: #ffebee;
            padding: 15px;
            border: 1px solid #f44336;
        }

        .success {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            padding: 10px;
        }
    </style>
</head>

<body>

<!-- Navigation -->
<nav>
    <a href="index.html">Home</a>
    <a href="complaint.html">Submit Complaint</a>
    <a href="track.html">Track Complaint</a>
    <a href="admin.html">Admin Dashboard</a>
</nav>

<div class="container">

    <h1>Track Your Complaint</h1>

    <label>Enter Complaint ID</label>

    <input
        type="number"
        id="complaintId"
        placeholder="Example: 5"
    >

    <button onclick="trackComplaint()">
        Track Complaint
    </button>

    <div id="result"></div>

</div>

<script>

async function trackComplaint() {

    const complaintId =
        document.getElementById("complaintId").value;

    const result =
        document.getElementById("result");

    if (!complaintId) {

        result.className = "error";

        result.innerHTML =
            "Please enter a Complaint ID.";

        return;
    }

    result.className = "";

    result.innerHTML =
        "Searching for complaint...";

    try {

        const response = await fetch(
            `http://127.0.0.1:8000/complaints/${complaintId}`
        );

        const data = await response.json();

        if (!response.ok) {

            result.className = "error";

            result.innerHTML =
                `<strong>Error:</strong> ${data.detail}`;

            return;
        }

        result.className = "success";

        result.innerHTML = `

            <div class="item">
                <strong>Complaint ID:</strong>
                ${data.complaint_id}
            </div>

            <div class="item">
                <strong>Complaint:</strong>
                ${data.complaint_text}
            </div>

            <div class="item">
                <strong>Location:</strong>
                ${data.location}
            </div>

            <div class="item">
                <strong>Category:</strong>
                ${data.category}
            </div>

            <div class="item">
                <strong>Department:</strong>
                ${data.department}
            </div>

            <div class="item status">
                <strong>Status:</strong>
                ${data.status}
            </div>

        `;

    }

    catch (error) {

        console.error(error);

        result.className = "error";

        result.innerHTML =
            "Unable to connect to the server. " +
            "Please make sure FastAPI is running.";

    }

}

</script>

</body>
</html>
